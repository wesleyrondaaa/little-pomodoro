name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\tests\LittlePomodoro.Tests.csproj

      - name: Build app and tests
        run: dotnet build .\tests\LittlePomodoro.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet run --project .\tests\LittlePomodoro.Tests.csproj -c Release --no-build
